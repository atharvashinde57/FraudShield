# Dynamic Port for Cloud Hosts (Railway / Render / Heroku) or default 8080
server.port=${PORT:8080}

# Application Name
spring.application.name=fraudshield-backend

# Datasource Configuration (Dynamic Cloud MySQL or Fallback H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:fraudshield_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Hibernate JPA Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (Provide APP_JWT_SECRET environment variable in production)
app.jwt.secret=${APP_JWT_SECRET:FraudShieldDevelopmentOnlyDefaultSecretKey998877665544332211}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

