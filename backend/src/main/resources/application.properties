server.port=8080

# Application Name
spring.application.name=fraudshield-backend

# Datasource Configuration (Primary: H2 / MySQL Compatible)
spring.datasource.url=jdbc:h2:mem:fraudshield_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=FraudShieldSecuritySuperSecretKey2026EnterpriseSecOpsAuthenticationTokenKey9988776655
app.jwt.expiration-ms=86400000
